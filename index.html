<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EDM Visuals</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="black"/><circle cx="32" cy="32" r="22" fill="white"/><circle cx="32" cy="32" r="16" fill="black"/></svg>'>

  <link rel="stylesheet" href="style.css" />

  <!-- Import map so addons that say `import ... from 'three'` can resolve -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.155.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="ui">
    <div class="row">
      <label class="btn">
        <input id="audio-upload" type="file" accept="audio/*" />
        Load Track
      </label>
      <button id="play-btn" class="btn">Play</button>
      <label>Visual:
        <select id="vis-type">
          <option value="circle">Circle Waveform</option>
          <option value="spiral">Spiral</option>
          <option value="star">Star Burst 3D</option>
          <option value="cube">Cubic Field</option>
          <option value="particles">Neon Swirl Particles</option>
          <option value="errors">Vintage Errors (Win95)</option>
          <option value="lissajous">Laser Lissajous</option>
          <option value="boids">Boids + Beat Bursts</option>
          <option value="fftTunnel">FFT Tunnel (Lines)</option>
          <option value="kaleidoPlane">Kaleidoscope Plane</option>
          <option value="city">Instanced Cityscape</option>
          <option value="glitchRing">Glitch Ring</option>
          <option value="vjRings">VJ Smooth Rings (FS)</option>
          <option value="neonKaleido">Neon Kaleido Blink (FS)</option>
          <option value="starTunnel">Stars Tunnel</option>
          <option value="bloomTunnel">Bloom Tunnel (Neon)</option>
          <option value="glitchFX">Glitch FX (RGB Split)</option>
          <option value="godrays">God Rays (Volumetric)</option>
        </select>
      </label>
    </div>

    <div class="row">
      <label>Color change (sec):
        <input id="color-speed-slider" type="range" min="0.1" max="5" step="0.1" value="0.5" />
      </label>
      <div class="time">
        <span id="time-current">0:00</span> /
        <span id="time-total">0:00</span>
      </div>
    </div>

    <input id="seek-slider" type="range" min="0" max="0" step="0.01" value="0" />
  </div>

  <!-- Load our code as a module so ESM imports work -->
  <script type="module" src="script.js"></script>
</body>
</html>
