<!doctype html>
<meta charset="utf-8">
<title>Night Rider isolated render review</title>
<link rel="icon" href="data:,">
<style>body{margin:0;background:#000}canvas{display:block}</style>
<script type="module">
  import * as THREE from 'three/webgpu';
  import { modeDefinitions } from '../../../src/modes/registry.ts';
  import { NIGHT_RIDER_SHOTS } from '../../../src/modes/nightRiderMode.ts';
  import { presetBudget } from '../../../src/rendering/quality.ts';
  import { createOutputPipeline } from '../../../src/rendering/OutputPipeline.ts';

  const renderer = new THREE.WebGPURenderer({forceWebGL: true, antialias:false});
  await renderer.init(); renderer.setSize(960,540);
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
  const mode = modeDefinitions.find((m) => m.id === (new URLSearchParams(location.search).has('v2')?'nightRiderV2':'nightRider')).create(presetBudget('compatibility'));
  await mode.ready;
  const frame = {time:0,delta:0,aspect:16/9,spectrumMapping:'linear',sampleRate:48000,hue:0,reducedMotion:false,reducedFlash:true,
    response:{bass:0.7,loudness:0.7,impact:0,bounce:0.5},
    audio:{waveform:new Float32Array(1024),spectrum:new Uint8Array(512),bass:0.7,mid:0.5,highs:0.5,rms:0.5,onset:false,time:0}};
  mode.update(frame);
  const pipeline = createOutputPipeline(renderer,mode.scene,mode.camera,mode.filter);
  document.body.append(renderer.domElement);
  const state = () => {
    const bike = mode.scene.getObjectByName('BikeRoot');
    const at = (name) => mode.scene.getObjectByName(name)?.getWorldPosition(new THREE.Vector3()).toArray();
    const rider=mode.scene.getObjectByName('V2 supplied anime rider');
    const vertex=(i)=>rider?.applyBoneTransform(i,new THREE.Vector3().fromBufferAttribute(rider.geometry.getAttribute('position'),i)).toArray();
    return {...mode.scene.userData, riderPresent:!!mode.scene.getObjectByName('Head')||!!rider,
      riderVertex:vertex(1000), riderBones:rider?.skeleton.bones.map(b=>b.getWorldPosition(new THREE.Vector3()).toArray()),
      frontWheel:at('FrontWheel'), rearWheel:at('RearWheel'), outlet:at('animated exhaust outlet'),
      bikePosition:bike?.getWorldPosition(new THREE.Vector3()).toArray(),
      bikeMeshes: bike ? (()=>{let n=0; bike.traverse(o=>{if(o.isMesh)n++});return n;})() : 0,
      calls:renderer.info.render.drawCalls};
  };
  // PassNode caches a scene per animation frame. Render on a fresh RAF after each simulated update.
  const renderFrame=()=>new Promise(resolve=>requestAnimationFrame(()=>{pipeline.render(0.35);resolve(state());}));
  window.nightRiderReview = {
    shots:NIGHT_RIDER_SHOTS, state,
    rigHealth(){
      const mesh=mode.scene.getObjectByName('V2 supplied anime rider'),g=mesh.geometry,p=g.getAttribute('position'),w=g.getAttribute('skinWeight');
      mesh.skeleton.update();const posed=Array.from({length:p.count},(_,i)=>mesh.applyBoneTransform(i,new THREE.Vector3().fromBufferAttribute(p,i)));
      let maxEdge=0,maxWeightError=0;
      for(let i=0;i<g.index.count;i+=3){const a=g.index.getX(i),b=g.index.getX(i+1),c=g.index.getX(i+2);maxEdge=Math.max(maxEdge,posed[a].distanceTo(posed[b]),posed[b].distanceTo(posed[c]),posed[c].distanceTo(posed[a]));}
      for(let i=0;i<p.count;i++)maxWeightError=Math.max(maxWeightError,Math.abs(w.getX(i)+w.getY(i)+w.getZ(i)+w.getW(i)-1));
      return {finite:posed.every(v=>v.toArray().every(Number.isFinite)),maxEdge,maxWeightError};
    },
    view(index,phase=0.5){
      let guard=0;
      while(mode.scene.userData.shotIndex!==index && guard++<1500){frame.delta=0.1;frame.time+=0.1;mode.update(frame);}
      const target = NIGHT_RIDER_SHOTS[index].seconds*phase;
      while(mode.scene.userData.elapsed+0.00001<target){frame.delta=Math.min(0.1,target-mode.scene.userData.elapsed);frame.time+=frame.delta;mode.update(frame);}
      mode.scene.updateMatrixWorld(true); return renderFrame();
    },
    frozen(){frame.reducedMotion=true;frame.delta=10;mode.update(frame);return renderFrame();},
    beat(reducedFlash=false){
      frame.reducedMotion=false;frame.reducedFlash=reducedFlash;
      frame.audio.onset=false;frame.response={bass:0.2,loudness:0.6,impact:0,bounce:0};
      for(let i=0;i<5;i++){frame.delta=0.1;frame.time+=0.1;mode.update(frame);}
      frame.audio.onset=true;frame.response={bass:1,loudness:1,impact:1,bounce:1};frame.delta=0.016;frame.time+=frame.delta;
      mode.update(frame);return renderFrame();
    },
    async flamePixels(){
      const plume=mode.scene.getObjectByName('beat exhaust flame');
      const canvas=document.createElement('canvas');canvas.width=960;canvas.height=540;const ctx=canvas.getContext('2d');
      const capture=()=>new Promise(resolve=>requestAnimationFrame(()=>{pipeline.render(0.35);ctx.drawImage(renderer.domElement,0,0);resolve(ctx.getImageData(0,0,960,540).data);}));
      plume.visible=true;const shown=await capture();plume.visible=false;const hidden=await capture();plume.visible=true;await renderFrame();
      let changed=0;for(let i=0;i<shown.length;i+=4)if(Math.abs(shown[i]-hidden[i])+Math.abs(shown[i+1]-hidden[i+1])+Math.abs(shown[i+2]-hidden[i+2])>6)changed++;
      return {changed,position:plume.getWorldPosition(new THREE.Vector3()).toArray()};
    },
    release(){
      mode.dispose();pipeline.dispose();
      return {children:mode.scene.children.length};
    },
  };
  await renderFrame(); document.body.dataset.ready='true';
</script>
