<!doctype html>
<meta charset="utf-8">
<title>Dragon render review</title>
<link rel="icon" href="data:,">
<style>body{margin:0;background:#07101b}canvas{display:block}</style>
<script type="module">
  import * as THREE from 'three/webgpu';
  import { createHighPolyDragonMode } from '../../../src/modes/flightModes.ts';
  const renderer = new THREE.WebGPURenderer({ forceWebGL: !new URLSearchParams(location.search).has('webgpu'), antialias: true });
  await renderer.init(); renderer.setSize(960, 640);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const mode = createHighPolyDragonMode(); await mode.ready;
  document.body.append(renderer.domElement);
  const frame = { time: 0, delta: 1/60, aspect: 1.5, spectrumMapping: 'linear', sampleRate: 48000, hue: 0,
    reducedMotion: false, reducedFlash: true, response: { bass: .6, loudness: .7, impact: 0, bounce: .65 },
    audio: { waveform: new Float32Array(1024), spectrum: new Uint8Array(512).fill(120), bass: .6, mid: .5, highs: .4, rms: .6, onset: false, time: 0 } };
  const render = async () => { mode.scene.updateMatrixWorld(true); await renderer.renderAsync(mode.scene, mode.camera); };
  const advance = async (n = 1, onset = false) => {
    for(let i=0;i<n;i++) { frame.time += frame.delta; frame.audio.onset = onset && i===0; frame.response.impact = frame.audio.onset ? 1 : 0; mode.update(frame); }
    await render(); return state();
  };
  const state = () => {
    let triangles=0; mode.scene.traverse(o=>{ if(o.isSkinnedMesh) triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3; });
    return { triangles, gpu:!!renderer.backend.isWebGPUBackend, fingers: mode.scene.getObjectByName('LeftWingFinger3_1')?.quaternion.toArray(),
      jaw: mode.scene.getObjectByName('Jaw')?.quaternion.toArray(),
      tips: ['Left','Right'].map(side=>mode.scene.getObjectByName(`${side}WingFinger2_Tip`).getWorldPosition(new THREE.Vector3()).toArray()),
      heat: mode.scene.children.find(o=>o.isPointLight)?.intensity ?? 0,
      camera: mode.camera.position.toArray(), calls:renderer.info.render.drawCalls };
  };
  window.dragonReview={advance,state,
    async studio() { const root=mode.scene.children.find(o=>o.getObjectByName('LeftWingRoot')); mode.scene.children.forEach(o=>o.visible=o===root||!!o.isLight); mode.scene.fog=null; mode.scene.background=new THREE.Color('#111d2c'); await render(); },
    async angle(az,el=20,distance=13) { const a=az*Math.PI/180,e=el*Math.PI/180; mode.camera.position.set(Math.sin(a)*Math.cos(e)*distance,Math.sin(e)*distance,Math.cos(a)*Math.cos(e)*distance-.5); mode.camera.lookAt(0,.4,-.5); await render(); },
    async detail(part='face') {
      const target=new THREE.Vector3(), end=new THREE.Vector3();
      if(part==='face') { mode.scene.getObjectByName('Head').getWorldPosition(target); target.add(new THREE.Vector3(0,.13,.43)); mode.camera.position.copy(target).add(new THREE.Vector3(1.1,.3,.85)); }
      else { const prefix=part==='hind'?'LeftHind':'LeftFront'; mode.scene.getObjectByName(prefix+'Root').getWorldPosition(target); mode.scene.getObjectByName(prefix+'Toe').getWorldPosition(end); target.lerp(end,.6); mode.camera.position.copy(target).add(new THREE.Vector3(1.2,.16,.8)); }
      mode.camera.lookAt(target); await render();
    },
    loud(value) { frame.response.loudness=value; },
    release(){mode.dispose();renderer.dispose();return mode.scene.children.length;}
  };
  await advance(); document.body.dataset.ready='true';
</script>
