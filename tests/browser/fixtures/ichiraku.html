<!doctype html>
<meta charset="utf-8">
<title>Ichiraku / Neon Nights render review</title>
<link rel="icon" href="data:,">
<style>body{margin:0;background:#020511}canvas{display:block}</style>
<script type="module">
  import * as THREE from 'three/webgpu';
  import { createIchirakuMode, ICHIRAKU_SHOTS } from '../../../src/modes/ichirakuMode.ts';
  import { presetBudget } from '../../../src/rendering/quality.ts';
  import { createOutputPipeline } from '../../../src/rendering/OutputPipeline.ts';
  const renderer=new THREE.WebGPURenderer({forceWebGL:true,antialias:false});await renderer.init();renderer.setSize(960,540);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.outputColorSpace=THREE.SRGBColorSpace;
  const mode=createIchirakuMode(presetBudget('compatibility'));await mode.ready;
  const frame={time:0,delta:0,aspect:16/9,spectrumMapping:'linear',sampleRate:48000,hue:0,reducedMotion:false,reducedFlash:false,
    response:{bass:0.45,loudness:0.55,impact:0,bounce:0},
    audio:{waveform:new Float32Array(1024),spectrum:new Uint8Array(512),bass:0.45,mid:0.5,highs:0.4,rms:0.5,onset:false,time:0}};
  mode.update(frame);const pipeline=createOutputPipeline(renderer,mode.scene,mode.camera,mode.filter);document.body.append(renderer.domElement);
  const state=()=>({...mode.scene.userData,camera:mode.camera.position.toArray(),calls:renderer.info.render.drawCalls,
    textures:['noren_panel_01','roof_main'].map(name=>!!mode.scene.getObjectByName(name)?.material.map),
    lampIntensity:mode.scene.getObjectByName('Ichiraku / main lantern light').intensity});
  const render=()=>new Promise(resolve=>requestAnimationFrame(()=>{pipeline.render(0.4);resolve(state());}));
  const step=(n=1)=>{for(let i=0;i<n;i++){frame.delta=0.1;frame.time+=frame.delta;mode.update(frame);}};
  const quiet=()=>{frame.audio.onset=false;frame.response={bass:0.1,loudness:0.2,impact:0,bounce:0};step(10);};
  const kick=(limited=false,snare=false)=>{frame.reducedMotion=false;frame.reducedFlash=limited;quiet();
    frame.audio.onset=true;frame.audio.bass=snare?0.1:1;frame.audio.highs=snare?1:0.2;
    frame.response={bass:snare?0.1:1,loudness:1,impact:1,bounce:1};step();};
  window.ichirakuReview={shots:ICHIRAKU_SHOTS,state,
    view(index,phase=0.55){let guard=0;frame.reducedMotion=false;frame.audio.onset=false;frame.response.impact=0;
      while(mode.scene.userData.shotIndex!==index&&guard++<2000)step();
      const target=ICHIRAKU_SHOTS[index].seconds*phase;while(mode.scene.userData.elapsed+0.00001<target){frame.delta=Math.min(0.1,target-mode.scene.userData.elapsed);frame.time+=frame.delta;mode.update(frame);}return render();},
    probe(){mode.scene.updateMatrixWorld(true);mode.camera.updateMatrixWorld(true);const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),mode.camera);
      const hit=ray.intersectObject(mode.scene.getObjectByName('Ichiraku / supplied ramen shop'),true)[0];return hit?{name:hit.object.name,distance:hit.distance}:null;},
    beat(limited=false,snare=false){kick(limited,snare);return render();},
    frozen(){frame.reducedMotion=true;frame.delta=30;for(let i=0;i<20;i++)mode.update(frame);return render();},
    portrait(){frame.aspect=9/16;renderer.setSize(540,960);frame.delta=0;mode.update(frame);return render();},
    pixelStats(){return new Promise(resolve=>requestAnimationFrame(()=>{pipeline.render(0.4);const canvas=document.createElement('canvas');
      canvas.width=renderer.domElement.width;canvas.height=renderer.domElement.height;const ctx=canvas.getContext('2d');ctx.drawImage(renderer.domElement,0,0);
      const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;let lit=0;for(let i=0;i<pixels.length;i+=4)if(pixels[i]+pixels[i+1]+pixels[i+2]>100)lit++;resolve({lit});}));},
    async pulsePixels(){
      quiet();const position=mode.camera.position.clone(),rotation=mode.camera.quaternion.clone();
      const canvas=document.createElement('canvas');canvas.width=960;canvas.height=540;const ctx=canvas.getContext('2d');
      const capture=()=>new Promise(resolve=>requestAnimationFrame(()=>{pipeline.render(0.4);ctx.drawImage(renderer.domElement,0,0);resolve(ctx.getImageData(0,0,960,540).data);}));
      const before=await capture();const low=state();kick();mode.camera.position.copy(position);mode.camera.quaternion.copy(rotation);const after=await capture();const high=state();let changed=0;
      for(let i=0;i<before.length;i+=4)if(Math.abs(before[i]-after[i])+Math.abs(before[i+1]-after[i+1])+Math.abs(before[i+2]-after[i+2])>18)changed++;
      return {changed,low,high};
    },
    release(){mode.dispose();pipeline.dispose();return mode.scene.children.length;}
  };await render();document.body.dataset.ready='true';
</script>
