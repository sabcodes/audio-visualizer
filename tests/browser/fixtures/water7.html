<!doctype html>
<meta charset="utf-8">
<title>Water 7 render review</title>
<link rel="icon" href="data:,">
<style>body{margin:0;background:#91cde0}canvas{display:block}</style>
<script type="module">
  import * as THREE from 'three/webgpu';
  import { createWater7Mode, WATER7_SHOTS } from '../../../src/modes/water7Mode.ts';
  import { presetBudget } from '../../../src/rendering/quality.ts';
  import { createOutputPipeline } from '../../../src/rendering/OutputPipeline.ts';
  const renderer=new THREE.WebGPURenderer({forceWebGL:true,antialias:false});await renderer.init();renderer.setSize(960,540);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.outputColorSpace=THREE.SRGBColorSpace;
  const mode=createWater7Mode(presetBudget('compatibility'));await mode.ready;
  const frame={time:0,delta:0,aspect:16/9,spectrumMapping:'linear',sampleRate:48000,hue:0,reducedMotion:false,reducedFlash:false,
    response:{bass:0.55,loudness:0.6,impact:0,bounce:0},
    audio:{waveform:new Float32Array(1024),spectrum:new Uint8Array(512),bass:0.55,mid:0.6,highs:0.5,rms:0.5,onset:false,time:0}};
  mode.update(frame);const pipeline=createOutputPipeline(renderer,mode.scene,mode.camera,mode.filter);document.body.append(renderer.domElement);
  const state=()=>({...mode.scene.userData,camera:mode.camera.position.toArray(),calls:renderer.info.render.drawCalls,
    boat:mode.scene.getObjectByName('boat_03')?.parent.position.toArray(),children:mode.scene.children.length});
  const render=()=>new Promise(resolve=>requestAnimationFrame(()=>{pipeline.render(0.2);resolve(state());}));
  window.water7Review={shots:WATER7_SHOTS,state,
    probe(){mode.scene.updateMatrixWorld(true);mode.camera.updateMatrixWorld(true);const ray=new THREE.Raycaster();
      return [[0,0],[-0.5,0],[0.5,0],[0,0.5],[0,-0.5]].map(([x,y])=>{ray.setFromCamera(new THREE.Vector2(x,y),mode.camera);
        const hit=ray.intersectObjects(mode.scene.getObjectByName('Water 7 / supplied city').children,true).filter(h=>h.object.name!=='sea_base')[0];return hit?{name:hit.object.name,distance:hit.distance,point:hit.point.toArray()}:null;});},
    view(index,phase=0.55){let guard=0;frame.reducedMotion=false;while(mode.scene.userData.shotIndex!==index&&guard++<2000){frame.delta=0.1;frame.time+=0.1;mode.update(frame);}
      const target=WATER7_SHOTS[index].seconds*phase;while(mode.scene.userData.elapsed+0.00001<target){frame.delta=Math.min(0.1,target-mode.scene.userData.elapsed);frame.time+=frame.delta;mode.update(frame);}return render();},
    beat(limited=false){frame.reducedMotion=false;frame.reducedFlash=limited;frame.audio.onset=false;frame.delta=0.1;for(let i=0;i<10;i++)mode.update(frame);
      frame.audio.onset=true;frame.response={bass:1,loudness:1,impact:1,bounce:1};mode.update(frame);return render();},
    frozen(){frame.reducedMotion=true;frame.delta=30;for(let i=0;i<20;i++)mode.update(frame);return render();},
    portrait(){frame.aspect=9/16;renderer.setSize(540,960);frame.delta=0;mode.update(frame);return render();},
    async change(){const canvas=document.createElement('canvas');canvas.width=960;canvas.height=540;const ctx=canvas.getContext('2d');
      const capture=()=>new Promise(resolve=>requestAnimationFrame(()=>{pipeline.render(0.2);ctx.drawImage(renderer.domElement,0,0);resolve(ctx.getImageData(0,0,960,540).data);}));
      const before=await capture();frame.delta=0.1;for(let i=0;i<10;i++)mode.update(frame);const after=await capture();let changed=0;
      for(let i=0;i<before.length;i+=4)if(Math.abs(before[i]-after[i])+Math.abs(before[i+1]-after[i+1])+Math.abs(before[i+2]-after[i+2])>12)changed++;
      return changed;},
    release(){mode.dispose();pipeline.dispose();return mode.scene.children.length;}
  };await render();document.body.dataset.ready='true';
</script>
