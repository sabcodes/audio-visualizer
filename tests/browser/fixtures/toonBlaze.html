<!doctype html>
<meta charset="utf-8">
<title>Toon Blaze isolated render check</title>
<link rel="icon" href="data:,">
<style>body{margin:0;background:#000}canvas{display:block}</style>
<script type="module">
  import * as THREE from 'three/webgpu';
  import { createToonBlazeMode } from '../../../src/modes/toonBlazeMode.ts';
  import { presetBudget } from '../../../src/rendering/quality.ts';
  import { createOutputPipeline } from '../../../src/rendering/OutputPipeline.ts';

  const backend = new URLSearchParams(location.search).get('backend') ?? 'webgl2';
  const renderer = new THREE.WebGPURenderer({forceWebGL:backend === 'webgl2',antialias:false});
  await renderer.init(); renderer.setSize(960,540);
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
  const mode = createToonBlazeMode(presetBudget(new URLSearchParams(location.search).get('quality') ?? 'compatibility')); await mode.ready;
  const frame = {time:0,delta:0,aspect:16/9,spectrumMapping:'linear',sampleRate:48000,hue:0,reducedMotion:false,reducedFlash:true,
    response:{bass:0,loudness:0,impact:0,bounce:0},
    audio:{waveform:new Float32Array(1024),spectrum:new Uint8Array(512),bass:0,mid:0,highs:0,rms:0,onset:false,time:0}};
  mode.update(frame);
  const pipeline = createOutputPipeline(renderer,mode.scene,mode.camera);
  document.body.append(renderer.domElement);
  window.toonBlazeReview = {
    backend:renderer.backend.isWebGPUBackend ? 'webgpu' : 'webgl2',
    advance(seconds,music=false,reducedMotion=false){
      frame.reducedMotion=reducedMotion;
      frame.response=music ? {bass:0.8,loudness:0.75,impact:0.7,bounce:0.6} : {bass:0,loudness:0,impact:0,bounce:0};
      frame.audio.highs=music ? 0.7 : 0;
      for(let i=0;i<Math.round(seconds*30);i++){
        frame.delta=1/30; frame.time+=frame.delta; frame.audio.time=frame.time;
        frame.audio.onset=music && i%15 === 0; mode.update(frame);
      }
      pipeline.render(0);
      return {car:!!mode.scene.getObjectByName('Body'),wheels:['FL','FR','RL','RR'].filter(s=>mode.scene.getObjectByName(`Wheel_${s}`)).length,
        flames:mode.scene.getObjectByName('turbulent flames').count,smoke:mode.scene.getObjectByName('rising smoke').count};
    },
    dispose(){pipeline.dispose();mode.dispose();return mode.scene.children.length;},
  };
  pipeline.render(0); document.body.dataset.ready='true';
</script>
